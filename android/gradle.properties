# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Capacitor-шаблон ставит 1536m; подняли до 3072m, потому что в assets/public
# лежит однораздельный index.html на ~2.9 МБ (вместе с inline wasm sql.js) и
# aapt2/dexing на 1.5 ГБ упираются в OOM.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
