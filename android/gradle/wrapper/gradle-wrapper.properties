distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Capacitor 8 генерирует здесь 8.14.3, но в этой среде:
#   * services.gradle.org отдаёт HTML-заглушку на /distributions/*.zip -> скачать 8.14.3 нельзя;
#   * доступна только версия, уже лежащая в кэше ~/.gradle/wrapper/dists (9.3.1);
#   * доступный JDK — 25 (Android Studio jbr), а Java 25 как JVM для Gradle
#     поддерживается начиная с Gradle 9.1.
# Поэтому используем 9.3.1. Хэш-каталог кэша вычисляется из этого URL, так что
# URL должен остаться ровно таким же, иначе wrapper попытается качать заново.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
